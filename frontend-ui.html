<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #chat-log {
            height: 400px;
            overflow-y: scroll;
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #f8f9fa;
        }

        .user {
            font-weight: bold;
            color: #800000;
        }

        .bot {
            color: #212529;
        }

        .message {
            margin-bottom: 10px;
        }

        .modal-body pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>

<body class="container py-4">
    <h1 class="mb-4">Processor</h1>

    <div class="mb-3">
        <div id="chat-log" class="mb-2"></div>
        <form onsubmit="sendMessage(); return false;">
            <div class="input-group">
                <input required id="chat-input" type="text" class="form-control" placeholder="Type your message...">
                <button type="submit" class="btn btn-primary">Send</button>
            </div>
        </form>
    </div>
    <div class="mb-3">
        <button class="btn btn-outline-secondary" onclick="showState()">View Current State</button>
        <!-- <button class="btn btn-outline-info" onclick="loadHistory()">View Conversation History</button> -->
    </div>

    <!-- Modal for State -->
    <div class="modal fade" id="stateModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">System State</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <pre id="state-content">Loading...</pre>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for History -->
    <div class="modal fade" id="historyModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Conversation History</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <pre id="history-content">Loading...</pre>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function sendMessage() {
            const input = document.getElementById("chat-input");
            const text = input.value.trim();
            if (!text) return;
            appendChat("user", text);
            input.value = "";

            const res = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: text })
            });
            const data = await res.json();
            appendChat("bot", data.response);
        }

        function appendChat(sender, text) {
            const chatLog = document.getElementById("chat-log");
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${sender}`;
            messageDiv.innerHTML = `<span class="${sender}">${sender === "user" ? "You" : "Bot"}:</span> ${text}`;
            chatLog.appendChild(messageDiv);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        async function showState() {
            const res = await fetch("/state");
            const state = await res.json();
            document.getElementById("state-content").textContent = JSON.stringify(state, null, 2);
            new bootstrap.Modal(document.getElementById("stateModal")).show();
        }

        async function loadHistory() {
            const res = await fetch("/history");
            const history = await res.json();
            document.getElementById("history-content").textContent = JSON.stringify(history, null, 2);
            new bootstrap.Modal(document.getElementById("historyModal")).show();
        }
    </script>
</body>

</html>
