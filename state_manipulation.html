<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pneuma-Seeker's State Viewer</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #f6f6f6;
        }
        .card-header {
            font-weight: bold;
        }
        table {
            font-size: 0.85rem;
            white-space: nowrap;
        }
        .table-container {
            flex: 0 0 auto;
            max-width: 400px;
            min-width: 200px;
        }
        .tables-flex {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: flex-start;
        }
        .table-title {
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }
    </style>
</head>
<body class="p-4">

<div class="container">
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white d-flex align-items-center">
            <i class="bi bi-database-fill me-2"></i> Pneuma-Seeker's State
        </div>
        <div class="card-body">

            <!-- T (Target Tables) -->
            <h5 class="mb-3 d-flex align-items-center">
                <i class="bi bi-table"></i>
                <span class="ms-2">T (Target Tables)</span>
                <span class="badge bg-primary ms-2">
                    Materialized: <span id="materialized-status">No</span>
                </span>
            </h5>
            <div id="target-schemas" class="tables-flex mb-4"></div>

            <!-- Q (SQL Queries) -->
            <h5 class="mb-3 d-flex align-items-center">
                <i class="bi bi-code-slash"></i>
                <span class="ms-2">Q (SQL Queries)</span>
                <span class="badge bg-success ms-2">
                    Executed: <span id="sql-status">No</span>
                </span>
            </h5>
            <ol id="sql-list" class="list-group list-group-numbered"></ol>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const state = {
        target_schemas: {
            "faculty": [
                {name: "Alice", "work address": "123 Main St"},
                {name: "Bob", "work address": "456 Elm"}
            ],
            "departments": [
                {dept: "CS"}, {dept: "Math"}
            ],
            "courses": [
                {course: "DB Systems", code: "CS505"},
                {course: "ML", code: "CS510"}
            ]
        },
        is_target_schemas_materialized: true,
        column_descriptions: {
            "faculty": {
                "name": "Full name of faculty member",
                "work address": "Office location"
            },
            "departments": {
                "dept": "Department name"
            },
            "courses": {
                "course": "Course title",
                "code": "Course code"
            }
        },
        sqls: [
            "SELECT name, `work address` FROM faculty;",
            "SELECT * FROM departments;"
        ],
        is_sql_executed: false
    };

    // Update status badges
    document.getElementById("materialized-status").textContent = state.is_target_schemas_materialized ? "Yes" : "No";
    document.getElementById("sql-status").textContent = state.is_sql_executed ? "Yes" : "No";

    // Populate T (Target Tables)
    const targetSchemasDiv = document.getElementById("target-schemas");
    for (const [tableName, rows] of Object.entries(state.target_schemas)) {
        const tableContainer = document.createElement("div");
        tableContainer.className = "table-container";

        const tableTitle = document.createElement("div");
        tableTitle.className = "table-title";
        tableTitle.textContent = tableName;
        tableContainer.appendChild(tableTitle);

        const tableEl = document.createElement("table");
        tableEl.className = "table table-striped table-hover table-bordered align-middle table-sm";

        // Headers with tooltips
        const thead = document.createElement("thead");
        const headerRow = document.createElement("tr");
        Object.keys(rows[0] || {}).forEach(col => {
            const th = document.createElement("th");
            th.textContent = col;
            th.setAttribute("data-bs-toggle", "tooltip");
            th.setAttribute("title", state.column_descriptions[tableName]?.[col] || "");
            headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);
        tableEl.appendChild(thead);

        // Rows
        const tbody = document.createElement("tbody");
        rows.forEach(row => {
            const tr = document.createElement("tr");
            Object.values(row).forEach(val => {
                const td = document.createElement("td");
                td.textContent = val;
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
        tableEl.appendChild(tbody);

        tableContainer.appendChild(tableEl);
        targetSchemasDiv.appendChild(tableContainer);
    }

    // Activate Bootstrap tooltips
    const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
    tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl);
    });

    // Populate Q (SQL Queries)
    const sqlList = document.getElementById("sql-list");
    state.sqls.forEach(sql => {
        const li = document.createElement("li");
        li.className = "list-group-item font-monospace";
        li.textContent = sql;
        sqlList.appendChild(li);
    });
</script>

</body>
</html>
