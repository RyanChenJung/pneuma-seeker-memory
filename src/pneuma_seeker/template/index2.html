<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Pneuma-Seeker's Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    body {
      background-color: #f6f6f6;
      font-family: system-ui, sans-serif;
    }

    /* Header styling for all cards */
    .card-header {
      font-weight: 600;
      background-color: #f8f9fa;
      /* soft light gray */
      color: #1d1d1d;
      cursor: pointer;
      /* indicates clickable if collapsible */
    }

    /* Badges */
    .badge-materialized {
      background-color: #FFD580;
      /* soft orange */
      color: #1d1d1d;
    }

    .badge-executed {
      background-color: #A9C1FF;
      /* soft blue */
      color: #1d1d1d;
    }

    table {
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .table-container {
      flex: 0 0 auto;
      max-width: 400px;
      min-width: 200px;
    }

    .tables-flex {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: flex-start;
    }

    .table-title {
      font-weight: 500;
      font-size: 0.9rem;
      margin-bottom: 0.25rem;
    }

    ol#sql-list {
      margin-bottom: 1rem;
    }

    .prov-iframe {
      width: 100%;
      min-height: 600px;
      border: none;
      display: block;
    }
  </style>
</head>

<body class="p-4">
  <div class="container">

    <!-- Collapsible Pneuma's State Card -->
    <div class="card mb-4 shadow-sm">
      <div class="card-header d-flex align-items-center" data-bs-toggle="collapse" data-bs-target="#pneumaCardBody"
        aria-expanded="true" aria-controls="pneumaCardBody">
        <i class="bi bi-database-fill me-2"></i> Pneuma's State
      </div>

      <div id="pneumaCardBody" class="collapse show">
        <div class="card-body">
          <!-- Target Tables Section -->
          <h5 class="mb-3 d-flex align-items-center">
            <i class="bi bi-table"></i>
            <span class="ms-2">T (Target Tables) <sup data-bs-toggle="tooltip"
                title="Tables are shown with sample rows.">*</sup></span>
            <span class="badge ms-2 badge-materialized">Materialized: <span id="materialized-status">No</span></span>
          </h5>
          <div id="T" class="tables-flex mb-4"></div>

          <!-- SQL Queries Section -->
          <h5 class="mb-3 d-flex align-items-center">
            <i class="bi bi-code-slash"></i>
            <span class="ms-2">Q (SQL Queries)</span>
            <span class="badge ms-2 badge-executed">Executed: <span id="sql-status">No</span></span>
          </h5>
          <ol id="sql-list" class="list-group list-group-numbered"></ol>
        </div>
      </div>
    </div>

    <!-- Pyvis Provenance Graph Card -->
    <div class="card mb-4 shadow-sm">
      <div class="card-header d-flex align-items-center" data-bs-toggle="collapse" data-bs-target="#provCardBody"
        aria-expanded="true" aria-controls="provCardBody">
        <i class="bi bi-diagram-3-fill me-2"></i> Provenance Graph
      </div>

      <div id="provCardBody" class="collapse show">
        <div class="card-body p-0">
          <iframe id="prov-iframe" class="prov-iframe"></iframe>
        </div>
      </div>
    </div>

    <!-- <div class="card mb-4 shadow-sm">
      <div class="card-header d-flex align-items-center">
        <i class="bi bi-diagram-3-fill me-2"></i> Provenance Graph
      </div>
      <div class="card-body p-0">
        <iframe id="prov-iframe" class="prov-iframe"></iframe>
      </div>
    </div> -->

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const state = {{ state | tojson }};
    document.getElementById("materialized-status").textContent = state.is_T_materialized ? "Yes" : "No";
    document.getElementById("sql-status").textContent = state.is_Q_executed ? "Yes" : "No";

    const targetSchemasDiv = document.getElementById("T");
    for (const [tableName, rows] of Object.entries(state.T || {})) {
      const tableContainer = document.createElement("div");
      tableContainer.className = "table-container";

      const tableTitle = document.createElement("div");
      tableTitle.className = "table-title";
      tableTitle.textContent = tableName;
      tableContainer.appendChild(tableTitle);

      const tableEl = document.createElement("table");
      tableEl.className = "table table-striped table-hover table-bordered align-middle table-sm";

      const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");
      Object.keys(rows[0] || {}).forEach(col => {
        const th = document.createElement("th");
        th.textContent = col;
        th.setAttribute("data-bs-toggle", "tooltip");
        th.setAttribute("title", state.column_descriptions?.[tableName]?.[col] || "");
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);
      tableEl.appendChild(thead);

      const tbody = document.createElement("tbody");
      (rows || []).forEach(row => {
        const tr = document.createElement("tr");
        Object.values(row).forEach(val => {
          const td = document.createElement("td");
          td.textContent = val;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      tableEl.appendChild(tbody);

      const scrollWrapper = document.createElement("div");
      scrollWrapper.style.overflowX = "auto";
      scrollWrapper.style.maxWidth = "100%";
      scrollWrapper.appendChild(tableEl);

      tableContainer.appendChild(scrollWrapper);
      targetSchemasDiv.appendChild(tableContainer);
    }

    const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
    tooltipTriggerList.map(function (tooltipTriggerEl) {
      return new bootstrap.Tooltip(tooltipTriggerEl);
    });

    const sqlList = document.getElementById("sql-list");
    (state.Q || []).forEach(sql => {
      const li = document.createElement("li");
      li.className = "list-group-item font-monospace";
      li.textContent = sql;
      sqlList.appendChild(li);
    });

    // Insert Pyvis graph HTML
    const provIframe = document.getElementById("prov-iframe");
    const provGraphHtml = {{ prov_graph_html | tojson | safe }};
    provIframe.srcdoc = provGraphHtml;
  </script>
</body>

</html>
